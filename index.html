<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rodrigues Tatuador - Arte Eterna na Pele</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rodrigues Tatuador - Mais de 10 anos transformando histórias em tatuagens únicas">

    <!-- FONTES -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- FUNDO GLOBAL COM FOTOS PASSANDO -->
<div class="global-bg"></div>

<div class="container">

    <!-- HEADER -->
    <header class="header">

        <!-- FUNDO DO HEADER COM ANIMAÇÃO -->
        <div class="header-bg"></div>

        <!-- CONTEÚDO -->
        <div class="header-content">
            <span class="badge">⚙️ RODRIGUES TATUADOR ⚙️</span>

            <h1>
                RODRIGUES<br>
                TATUADOR
            </h1>

            <p class="subtitle">Arte eterna na pele</p>

            <div class="buttons">
                <button onclick="openModal()">Agendar Tattoo</button>
            </div>
        </div>

    </header>

    <!-- NAVEGAÇÃO POR TABS -->
    <nav class="tabs">
        <button class="active" onclick="showTab('estilos', event)">Estilos</button>
        <button onclick="showTab('portfolio', event)">Portfólio</button>
        <button onclick="showTab('sobre', event)">Sobre</button>
    </nav>

    <!-- SEÇÃO: ESTILOS -->
    <section id="estilos" class="tab active">
        <div class="grid">
            <div class="card" style="background-image:url('img/tattoo1.jpg')">
                <span>Blackwork</span>
            </div>
            <div class="card" style="background-image:url('img/tattoo2.jpg')">
                <span>Fineline</span>
            </div>
            <div class="card" style="background-image:url('img/tattoo3.jpg')">
                <span>Old School</span>
            </div>
            <div class="card" style="background-image:url('img/tattoo4.jpg')">
                <span>Realismo</span>
            </div>
        </div>
    </section>

    <!-- SEÇÃO: PORTFÓLIO -->
    <section id="portfolio" class="tab">
        <div class="portfolio">
            <div class="item"><img src="img/tattoo1.jpg" alt="Trabalho 1"></div>
            <div class="item"><img src="img/tattoo2.jpg" alt="Trabalho 2"></div>
            <div class="item"><img src="img/tattoo3.jpg" alt="Trabalho 3"></div>
            <div class="item"><img src="img/tattoo4.jpg" alt="Trabalho 4"></div>
            <div class="item"><img src="img/tattoo5.jpg" alt="Trabalho 5"></div>
            <div class="item"><img src="img/tattoo6.jpg" alt="Trabalho 6"></div>
            <div class="item"><img src="img/tattoo7.jpg" alt="Trabalho 7"></div>
            <div class="item"><img src="img/tattoo8.jpg" alt="Trabalho 8"></div>
            <div class="item"><img src="img/tattoo9.jpg" alt="Trabalho 9"></div>
            <div class="item"><img src="img/tattoo10.jpg" alt="Trabalho 10"></div>
            <div class="item"><img src="img/tattoo11.jpg" alt="Trabalho 11"></div>
            <div class="item"><img src="img/tattoo12.jpg" alt="Trabalho 12"></div>
            <div class="item"><img src="img/tattoo13.jpg" alt="Trabalho 13"></div>
            <div class="item"><img src="img/tattoo14.jpg" alt="Trabalho 14"></div>
            <div class="item"><img src="img/tattoo15.jpg" alt="Trabalho 15"></div>
            <div class="item"><img src="img/tattoo16.jpg" alt="Trabalho 16"></div>
            <div class="item"><img src="img/tattoo17.jpg" alt="Trabalho 17"></div>
            <div class="item"><img src="img/tattoo18.jpg" alt="Trabalho 18"></div>
        </div>
    </section>

    <!-- SEÇÃO: SOBRE -->
    <section id="sobre" class="tab">
        <p class="sobre">
            Com mais de 10 anos de experiência, transformo histórias em tatuagens
            únicas, com técnica, identidade e respeito à arte.
        </p>
    </section>

</div>

<!-- MODAL DE AGENDAMENTO -->
<div id="modal" class="modal">
    <div class="modal-box">
        <button class="close" onclick="closeModal()" aria-label="Fechar"></button>

        <h2>Agendar Tattoo</h2>

        <form>
            <input type="text" placeholder="Nome" required>
            <input type="tel" placeholder="WhatsApp" required>
            <textarea placeholder="Descreva sua ideia" required></textarea>
            <input type="file" accept="image/*" multiple>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>

<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>

<script src="script.js"></script>
</body>
</html>
